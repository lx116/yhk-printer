<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YHK Document Editor</title>
<style>
:root{color-scheme:light dark;--paper:#fffaf0;--ink:#182126;--muted:#66737a;--line:#c9d1d3;--panel:#f2f5f4;--accent:#006d77;--error:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--panel);color:var(--ink);font:16px system-ui,sans-serif}.bar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bar h1{font-size:18px;margin:0 auto 0 0}.layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1fr);gap:12px;padding:12px;min-height:calc(100vh - 62px)}section{min-width:0;display:flex;flex-direction:column;gap:10px}.tools,.controls{display:flex;gap:6px;flex-wrap:wrap}button,select,input{font:inherit;padding:7px;border:1px solid var(--line);border-radius:5px;background:Canvas;color:CanvasText}button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}textarea{width:100%;min-height:55vh;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:12px;font:15px ui-monospace,monospace;background:Canvas;color:CanvasText}.drop{outline:3px dashed var(--accent);outline-offset:-6px}.summary{color:var(--muted);font-size:14px}.error{color:var(--error);min-height:1.2em}.paper{background:var(--paper);padding:16px;overflow:auto;min-height:60vh;background-image:linear-gradient(#00000008 1px,transparent 1px);background-size:100% 8px}.page{display:block;width:768px;max-width:none;image-rendering:pixelated;background:#fff;margin:0 auto 12px;box-shadow:0 2px 8px #0004}.ruler{height:20px;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 15.36px);opacity:.45}.field{display:flex;align-items:center;gap:5px}.field input{width:70px}@media(max-width:720px){.layout{grid-template-columns:1fr;padding:8px}.bar{padding:10px}.bar h1{width:100%}textarea{min-height:38vh}.paper{min-height:40vh}.page{width:768px}}
</style>
<body>
<header class="bar"><h1>YHK Document Editor</h1><button id="textTab" type="button">Text</button><button id="cardTab" type="button">Card</button><label>Template <select id="template" aria-label="Template"><option value="">Choose sample</option></select></label><button id="open" type="button">Open file</button><input id="file" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden></header>
<main class="layout"><section><div class="tools" aria-label="Markdown toolbar"><button data-wrap="**" type="button"><b>Bold</b></button><button data-wrap="*" type="button"><i>Italic</i></button><button data-prefix="# " type="button">H1</button><button data-prefix="## " type="button">H2</button><button data-prefix="- " type="button">List</button><button data-prefix="> " type="button">Quote</button><button data-prefix="---\n" type="button">Rule</button></div><textarea id="text" aria-label="Document Markdown" placeholder="Write Markdown here"></textarea><div class="controls"><label class="field">Font <select id="font" aria-label="Font"><option>sans</option><option>hand</option><option>mono</option></select></label><label class="field">Size pt <input id="size" type="number" min="8" max="16" value="10" aria-label="Text size in points"></label><label class="field">Align <select id="align" aria-label="Alignment"><option>left</option><option>center</option><option>right</option><option>justify</option></select></label><label class="field">Margin dots <input id="margin" type="number" min="0" max="80" value="12" aria-label="Margin in dots"></label><label class="field">Line height <input id="lineHeight" type="number" min="0.5" max="3" step="0.05" value="1.25" aria-label="Line height"></label><label class="field">Content <select id="content" aria-label="Content"><option>auto</option><option>photo</option><option>text</option><option>qr</option></select></label><label class="field">Definition <select id="definition" aria-label="Definition"><option>standard</option><option>hd</option></select></label><label class="field">Copies <input id="copies" type="number" min="1" value="1" aria-label="Copies"></label></div><div class="tools"><button id="print" class="primary" type="button">Print</button><button id="download" type="button">Download PNG</button><button id="copy" type="button">Copy as Markdown</button></div><div id="error" class="error" role="alert"></div></section><section><div class="summary"><span id="summary">Loading preview...</span></div><div class="ruler" title="Millimetres: 8 dots per mm"></div><div id="paper" class="paper" aria-label="Exact printed preview"></div></section></main>
<script>const editorInsertBefore=document.body.insertBefore.bind(document.body);document.body.insertBefore=(node,before)=>editorInsertBefore(node,before===document.body?null:before);</script>
<script>
const $=id=>document.getElementById(id),text=$('text'),error=$('error'),paper=$('paper'),summary=$('summary');let timer,controller,pages=[];
const options=()=>({font:$('font').value,size_pt:Number($('size').value),align:$('align').value,margin:Number($('margin').value),line_height:Number($('lineHeight').value),content:$('content').value,definition:$('definition').value});
function request(){clearTimeout(timer);timer=setTimeout(preview,300);try{localStorage.setItem('yhkp-editor-draft',text.value)}catch(_){}}
async function preview(){controller?.abort();controller=new AbortController();error.textContent='';try{const r=await fetch('/v1/documents/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value,format:'md',options:options()}),signal:controller.signal});const body=await r.json();if(!r.ok)throw Error(body.message||'Preview failed');pages=body.pages;paper.replaceChildren(...pages.map(page=>{const img=new Image();img.className='page';img.alt='Printed document strip';img.src='data:image/png;base64,'+page.png_base64;return img}));summary.textContent=`${body.rows} rows, ${body.mm.toFixed(1)} mm, about ${body.est_seconds}s`; }catch(e){if(e.name!=='AbortError')error.textContent=e.message}}
function selected(fn){const start=text.selectionStart,end=text.selectionEnd,value=text.value;const insert=fn(value.slice(start,end));text.setRangeText(insert,start,end,'end');text.focus();request()}
document.querySelectorAll('[data-wrap]').forEach(b=>b.onclick=()=>selected(v=>b.dataset.wrap+v+b.dataset.wrap));document.querySelectorAll('[data-prefix]').forEach(b=>b.onclick=()=>selected(v=>b.dataset.prefix+v));
document.querySelectorAll('textarea,input,select').forEach(el=>el.addEventListener('input',request));
$('open').onclick=()=>$('file').click();$('file').onchange=e=>readFile(e.target.files[0]);function readFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{text.value=reader.result;request()};reader.readAsText(file)}
for(const type of ['dragover','dragenter'])document.addEventListener(type,e=>{e.preventDefault();text.classList.add('drop')});for(const type of ['dragleave','drop'])document.addEventListener(type,e=>{e.preventDefault();text.classList.remove('drop')});document.addEventListener('drop',e=>readFile(e.dataTransfer.files[0]));
$('print').onclick=async()=>{if(!confirm('Queue this document for printing?'))return;const r=await fetch('/v1/documents/print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value,format:'md',options:options(),copies:Number($('copies').value)})});const b=await r.json();error.textContent=r.ok?`Queued job #${b.job_id}`:(b.message||'Print failed')};
$('download').onclick=()=>{if(!pages[0])return;const a=document.createElement('a');a.href='data:image/png;base64,'+pages[0].png_base64;a.download='yhkp-document.png';a.click()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text.value);error.textContent='Copied Markdown'}catch(_){error.textContent='Clipboard access was unavailable'}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){$('print').click()}});
async function setup(){try{const [templates,draft]=await Promise.all([fetch('/v1/documents/templates').then(r=>r.json()),new URLSearchParams(location.search).has('draft')?fetch('/v1/documents/draft/'+encodeURIComponent(new URLSearchParams(location.search).get('draft'))).then(r=>r.ok?r.json():null):Promise.resolve(null)]);templates.forEach(t=>{const o=document.createElement('option');o.value=t.text;o.textContent=t.name;$('template').append(o)});$('template').onchange=e=>{if(e.target.value){text.value=e.target.value;request()}};text.value=draft?.text??localStorage.getItem('yhkp-editor-draft')??'# A small note\n\nWrite a document, then inspect the exact printer bitmap.'}catch(_){text.value='# A small note\n\nWrite a document, then inspect the exact printer bitmap.'}request()}setup();
const main=document.querySelector('main');const cardPanel=document.createElement('main');cardPanel.id='cardPanel';cardPanel.hidden=true;cardPanel.innerHTML=`<section><h2>Photo + text card</h2><div id="cardDrop" class="card-drop">Drop a photo here or <button id="cardPick" type="button">choose photo</button><input id="cardFile" type="file" accept="image/*" hidden></div><textarea id="cardText" aria-label="Card Markdown" placeholder="Write card Markdown here"></textarea><div class="controls"><label class="field">Layout <select id="cardLayout"><option value="below">Below</option><option value="behind">Behind</option></select></label><label class="field">Flip <select id="cardFlip"><option value="book">Book</option><option value="calendar">Calendar</option></select></label><label class="field">Margin mm <input id="cardMargin" type="number" min="0" max="24" step="0.5" value="4"></label><label class="field">Font <select id="cardFont"><option>sans</option><option>hand</option><option>mono</option></select></label><label class="field">Size pt <input id="cardSize" type="number" min="7" step="0.5" value="10"></label><label class="field">Gap mm <input id="cardGap" type="number" min="0" max="30" step="0.5" value="5"></label><label class="field">Cut marks <input id="cardMarks" type="checkbox" checked></label><label class="field">Frame <input id="cardFrame" type="checkbox"></label><label class="field">Back offset mm <input id="cardOffset" type="number" min="-5" max="5" step="0.5" value="0"></label></div><div class="tools"><button id="cardCommit" class="primary" type="button">Send to TUI</button></div><div id="cardError" class="error" role="alert"></div></section><section><div id="cardSummary" class="summary">Choose a photo to preview.</div><div id="cardPreview" class="paper"></div></section>`;document.body.insertBefore(cardPanel,document.querySelector('script').parentElement);const card$=id=>document.getElementById(id);let cardPhoto='',cardTimer,cardController;const cardOptions=()=>({photo_base64:cardPhoto,text:card$('cardText').value,layout:card$('cardLayout').value,flip:card$('cardFlip').value,margin_mm:Number(card$('cardMargin').value),font:card$('cardFont').value,size_pt:Number(card$('cardSize').value),gap_mm:Number(card$('cardGap').value),cut_marks:card$('cardMarks').checked,frame:card$('cardFrame').checked,back_offset_mm:Number(card$('cardOffset').value)});function showCard(){main.hidden=true;cardPanel.hidden=false}function showText(){cardPanel.hidden=true;main.hidden=false}card$('cardTab').onclick=showCard;card$('textTab').onclick=showText;function cardRequest(){clearTimeout(cardTimer);cardTimer=setTimeout(cardPreview,300)}function setCardPhoto(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{cardPhoto=String(reader.result).split(',')[1]||'';card$('cardDrop').textContent=file.name;cardRequest()};reader.readAsDataURL(file)}card$('cardPick').onclick=()=>card$('cardFile').click();card$('cardFile').onchange=e=>setCardPhoto(e.target.files[0]);for(const type of ['dragover','dragenter'])card$('cardDrop').addEventListener(type,e=>{e.preventDefault();card$('cardDrop').classList.add('drop')});for(const type of ['dragleave','drop'])card$('cardDrop').addEventListener(type,e=>{e.preventDefault();card$('cardDrop').classList.remove('drop')});card$('cardDrop').addEventListener('drop',e=>setCardPhoto(e.dataTransfer.files[0]));cardPanel.querySelectorAll('textarea,input,select').forEach(el=>el.addEventListener('input',cardRequest));async function cardPreview(){if(!cardPhoto)return;cardController?.abort();cardController=new AbortController();card$('cardError').textContent='';try{const r=await fetch('/v1/cards/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cardOptions()),signal:cardController.signal});const b=await r.json();if(!r.ok)throw Error(b.message||'Preview failed');card$('cardPreview').replaceChildren(...['front','back'].map(side=>{const figure=document.createElement('figure'),caption=document.createElement('figcaption'),img=new Image();caption.textContent=side.toUpperCase();img.className='page';img.alt=`${side} card bitmap`;img.src='data:image/png;base64,'+b[side].png_base64;figure.append(caption,img);return figure}));card$('cardSummary').textContent=`${b.mm.toFixed(1)} mm total; front about ${b.front_est_seconds}s, back about ${b.back_est_seconds}s. ${b.instruction}`}catch(e){if(e.name!=='AbortError')card$('cardError').textContent=e.message}}card$('cardCommit').onclick=async()=>{if(!cardPhoto)return card$('cardError').textContent='Choose a photo first';const r=await fetch('/v1/cards/commit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cardOptions())});const b=await r.json();if(!r.ok)return card$('cardError').textContent=b.message||'Could not send card';card$('cardError').textContent='Sent to the TUI. You can close this tab and print there';window.close()};
</script>
<script>
cardPreview=async function(){if(!cardPhoto)return;cardController?.abort();cardController=new AbortController();card$('cardError').textContent='';try{const r=await fetch('/v1/cards/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cardOptions()),signal:cardController.signal});const b=await r.json();if(!r.ok)throw Error(b.message||'Preview failed');const sides=b.strip?[['strip','STRIP (photo, cut line, text)']]:[['front','FRONT'],['back','BACK']];card$('cardPreview').replaceChildren(...sides.map(([side,label])=>{const figure=document.createElement('figure'),caption=document.createElement('figcaption'),img=new Image();caption.textContent=label;img.className='page';img.alt=`${side} card bitmap`;img.src='data:image/png;base64,'+b[side].png_base64;figure.append(caption,img);return figure}));card$('cardSummary').textContent=b.strip?`${b.mm.toFixed(1)} mm total; about ${b.est_seconds}s. ${b.instruction}`:`${b.mm.toFixed(1)} mm total; front about ${b.front_est_seconds}s, back about ${b.back_est_seconds}s. ${b.instruction}`}catch(e){if(e.name!=='AbortError')card$('cardError').textContent=e.message}}
</script>
<style>.card-drop{padding:18px;border:2px dashed var(--accent);border-radius:6px;text-align:center}.card-drop button{padding:3px 7px}.card-drop.drop{background:#006d7720}#cardPanel{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1fr);gap:12px;padding:12px;min-height:calc(100vh - 62px)}#cardPanel h2{margin:0}@media(max-width:720px){#cardPanel{grid-template-columns:1fr;padding:8px}}</style>
</body>
</html>
